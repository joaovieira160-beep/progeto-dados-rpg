<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dados online</title>
</head>
<body>
    <style>
        
        body{
             background-image: url("assets/imgs/Captura\ de\ tela\ 2026-08-13\ 140206.png");
        }
        
    .dado{
        display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    
    }
    img{
        width: 300px;
    }

    .texto{
        display: flex;
        justify-content: center;
        align-self: center;
    }

    .exemplo{
        display: flex;
        justify-content: center;
        align-self: center;
        background-color: #a19a9a;
        width: 600px;
        height: 60px;
        margin: 30px auto;
    }

    .botao{
        display: block;
        margin: 30px auto;
        cursor: pointer;
    }

    .resultado{
        display: flex;
        justify-content: center;
        align-self: center;
    }

    .numero{
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: rgb(0, 0, 0);
    z-index: 1;
    font-size: 50px;
    }

    .botao-voltar {
    border: 2px solid black;
    background-color: #a19a9a;
    width: 200px;
    height: 50px;
    font-size: 25px;
}
    </style>
    

    <div class="texto">
        <h1>Role um d6 online!</h1>
    </div>

    <a href="assets/inicio.html">

    <div class="botao-voltar">
        Voltar para o início
    </div>
</a>

 <div class="exemplo">
        <h2>CLIQUE EM “ROLL” PARA GIRAR O DADO!</h2>
    </div>


    <div class="dado">

        <img src="assets/imgs/d6(melhorado).png" alt="dado">

        <div class="numero">
        <h2 id="numero">-</h2>
    </div>
    </div>




    <div class="resultado">
        <h1 id="resultado"> resultado: </h1>
    </div>

    <button onclick="rolar()" class="botao">
        <img src="assets/imgs/rool.png" alt="roll">
    </button>



<script>
    function rolar(){
    
    const elemento = document.getElementById("numero");

    let contador = 0;

    const intervalo = setInterval(() => {
        
        elemento.textContent = Math.floor(Math.random() * 100) + 1;

        contador++;

        
        if (contador >= 50) {
            clearInterval(intervalo);

            
            elemento.textContent = Math.floor(Math.random() * 6) + 1;
        }
    }, 20);
}

</script>

</body>
</html>
